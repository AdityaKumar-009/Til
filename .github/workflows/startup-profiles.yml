name: Launcher startup profiles

on:
  workflow_dispatch:
  push:
    branches:
      - feature/windows-phone-launcher-modes

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  generate-and-measure:
    # Profile capture is opt-in. Normal builds consume the checked-in profiles.
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[startup-profile]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build comparison and profile capture APKs
        run: |
          git worktree add --detach /tmp/til-profile-before HEAD^
          (cd /tmp/til-profile-before && bash gradlew assemblePerformance --stacktrace)
          cp /tmp/til-profile-before/app/build/outputs/apk/performance/app-performance.apk /tmp/til-profile-before.apk
          bash gradlew assembleProfileGeneration --stacktrace
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Capture profiles and compare optimized builds
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_2
          disable-animations: false
          script: bash .github/scripts/profile-and-benchmark.sh
      - name: Upload captured profiles and measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: launcher-startup-profiles
          path: |
            app/src/main/baseline-prof.txt
            app/src/main/startup-prof.txt
            app/build/startup-profiles
            app/build/profile-benchmark
          if-no-files-found: warn
          retention-days: 7

