name: W10M SDK payload location
on:
  push:
    branches:
      - evidence/w10m-sdk-probe
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect-official-package:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check Microsoft's public installer locations
        shell: bash
        run: |
          set -u
          fw='https://go.microsoft.com/fwlink/?prd=11966&pver=1.0&plcid=0x409&clcid=0x409&ar=Threshold&sar=Emulator&o1=10.0.15254.1'
          printf 'DownloadRoot redirect: '
          curl -LsS -o /dev/null --max-time 30 -w '%{http_code} %{url_effective}\n' "$fw"
          base='https://download.microsoft.com/download/E/3/4/E347E8C5-BD79-49AF-941C-D08893A45268/emulator'
          for p in Redistributable/1.0.0.0/WindowsPhoneSDK-VHD.msi Redistributable/1.0.0.0/Vhd1.cab; do
            printf '%s ' "$p"
            curl -LIsS -o /dev/null --max-time 30 -w '%{http_code} %{url_effective} %{size_download}\n' "$base/$p"
          done
