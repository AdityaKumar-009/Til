name: W10M SDK image inspection
on:
  push:
    branches:
      - evidence/w10m-sdk-probe
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect-official-package:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Extract official emulator image
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq msitools qemu-utils
          mkdir -p sdk-payload sdk-image
          base='https://download.microsoft.com/download/E/3/4/E347E8C5-BD79-49AF-941C-D08893A45268/emulator/Redistributable/1.0.0.0'
          curl --fail --retry 2 -LsS "$base/WindowsPhoneSDK-VHD.msi" -o sdk-payload/WindowsPhoneSDK-VHD.msi
          export base
          seq 1 50 | xargs -P 8 -I NUM sh -c 'curl --fail --retry 2 -LsS "$base/VhdNUM.cab" -o sdk-payload/VhdNUM.cab'
          du -sh sdk-payload
          msiextract -C sdk-image sdk-payload/WindowsPhoneSDK-VHD.msi
          find sdk-image -type f -printf '%s %p\n' | sort -nr | head -30
          find sdk-image -type f \( -iname '*.vhd' -o -iname '*.vhdx' \) -exec qemu-img info {} \;
          df -h .
