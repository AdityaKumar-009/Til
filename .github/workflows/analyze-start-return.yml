name: Analyze Start return reference

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/analyze-start-return.yml'
      - 'scripts/analyze_start_return_reference.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install analyzer dependencies
        run: python -m pip install --disable-pip-version-check opencv-python-headless numpy pillow
      - name: Decode and measure test.mp4 Start return
        run: python scripts/analyze_start_return_reference.py
      - name: Upload frame analysis
        uses: actions/upload-artifact@v4
        with:
          name: start-return-frame-analysis
          path: build/start-return-analysis/
          if-no-files-found: error
          retention-days: 2
