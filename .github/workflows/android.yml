name: Android build

on:
  push:
    branches: [ main, win81-fidelity ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Make wrapper executable
        run: chmod +x gradlew
      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace
      - name: Build optimized installable APK
        run: ./gradlew assemblePerformance --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tile8-windows81-apk
          path: app/build/outputs/apk/performance/*.apk
          if-no-files-found: error
          retention-days: 14

  reference-frames:
    if: github.ref == 'refs/heads/win81-fidelity'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout reference recording
        uses: actions/checkout@v4
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Extract reference timeline
        shell: bash
        run: |
          mkdir -p reference-frames/overview \
                   reference-frames/start-entrance \
                   reference-frames/start-apps-early \
                   reference-frames/start-apps-late
          ffprobe -v error -show_streams -show_format test.mp4 > reference-frames/metadata.txt

          # Broad timeline: each 5x5 sheet spans 12.5 seconds at 2 fps.
          ffmpeg -hide_banner -loglevel error -i test.mp4 \
            -vf "fps=2,scale=320:-2,tile=5x5:padding=2:margin=2" \
            -q:v 3 -vsync 0 reference-frames/overview/sheet-%02d.jpg

          # Keep individual 30 fps source frames at useful resolution so motion
          # can be measured frame-by-frame instead of inferred from thumbnails.
          ffmpeg -hide_banner -loglevel error -ss 55.5 -t 2.0 -i test.mp4 \
            -vf "fps=30,scale=640:-2" -q:v 2 -vsync 0 \
            reference-frames/start-entrance/frame-%03d.jpg

          # Early Start <-> Apps interaction visible in the opening seconds.
          ffmpeg -hide_banner -loglevel error -ss 1.5 -t 2.5 -i test.mp4 \
            -vf "fps=30,scale=640:-2" -q:v 2 -vsync 0 \
            reference-frames/start-apps-early/frame-%03d.jpg

          # Later Start/Apps interaction before Alarms, useful as a second sample.
          ffmpeg -hide_banner -loglevel error -ss 48.0 -t 3.5 -i test.mp4 \
            -vf "fps=30,scale=640:-2" -q:v 2 -vsync 0 \
            reference-frames/start-apps-late/frame-%03d.jpg
      - name: Upload reference frames
        uses: actions/upload-artifact@v4
        with:
          name: windows81-reference-frames
          path: reference-frames
          if-no-files-found: error
          retention-days: 2
