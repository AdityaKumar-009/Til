name: Android build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/windows-phone-launcher-modes

# Cancel superseded builds on the same branch so APK artifacts correspond to latest code.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Make wrapper executable
        run: chmod +x gradlew
      - name: Unit tests
        id: unit_tests
        continue-on-error: true
        run: ./gradlew testDebugUnitTest --stacktrace
      - name: Build optimized installable APK
        run: ./gradlew assemblePerformance --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: til-three-windows-modes-apk
          path: app/build/outputs/apk/performance/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Fail if unit tests failed
        if: steps.unit_tests.outcome == 'failure'
        run: |
          echo "::error::APK built, but unit tests failed; inspect the Unit tests step before merging."
          exit 1

  phone-motion-render:
    if: github.ref == 'refs/heads/feature/windows-phone-launcher-modes'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Capture and verify rendered phone motion
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          disable-animations: false
          script: bash .github/scripts/verify-phone-motion.sh
      - name: Upload frame captures and device test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phone-motion-render-evidence
          path: |
            app/build/motion-frames
            app/build/outputs/androidTest-results
            app/build/reports/androidTests
          retention-days: 14
