name: Temporary v2 verification

on:
  push:
    branches:
      - fix/stable-viewport-tile-drag-v2

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace
      - name: Compile debug
        run: ./gradlew assembleDebug --stacktrace
